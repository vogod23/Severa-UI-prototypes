<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello world – hosting test</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f7fa;
      --text: #1a2330;
      --muted: #5b6675;
      --accent: #1c64d4;
      --accent-text: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --bg: #141a22;
        --text: #e8edf3;
        --muted: #9aa6b5;
        --accent: #5b9bff;
        --accent-text: #0d1520;
      }
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      padding: 1.5rem;
      box-sizing: border-box;
    }
    main { max-width: 32rem; text-align: center; }
    h1 { font-size: 2.5rem; margin: 0 0 0.5rem; }
    p { color: var(--muted); line-height: 1.5; margin: 0 0 1.5rem; }
    button {
      font: inherit;
      font-weight: 600;
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 8px;
      background: var(--accent);
      color: var(--accent-text);
      cursor: pointer;
    }
    button:focus-visible { outline: 3px solid var(--text); outline-offset: 3px; }
    #result { margin-top: 1rem; min-height: 1.5em; color: var(--text); }
  </style>
</head>
<body>
  <main>
    <h1>Hello world</h1>
    <p>If you can see this page, hosting works. Click the button to check that interactions work too.</p>
    <button type="button" id="test">Test interaction</button>
    <div id="result" aria-live="polite"></div>
  </main>
  <script>
    let clicks = 0;
    document.getElementById('test').addEventListener('click', () => {
      clicks++;
      document.getElementById('result').textContent =
        'Interaction works. Clicked ' + clicks + (clicks === 1 ? ' time.' : ' times.');
    });
  </script>
</body>
</html>
